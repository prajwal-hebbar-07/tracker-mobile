name: Update the Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check for EXPO_TOKEN
        id: token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "EXPO_TOKEN is not set, so this push will not update the phone."
            echo "has=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.token.outputs.has == 'true'
        uses: actions/checkout@v5

      - name: Setup Node
        if: steps.token.outputs.has == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup EAS
        if: steps.token.outputs.has == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        if: steps.token.outputs.has == 'true'
        run: npm ci

      - name: Publish update
        if: steps.token.outputs.has == 'true'
        env:
          MESSAGE: ${{ github.event.head_commit.message || 'Update from GitHub' }}
        run: eas update --channel preview --environment preview --non-interactive --message "$MESSAGE"
