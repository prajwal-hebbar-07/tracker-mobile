name: Release

# Push to main that touches the mobile app or shared code: publish an over-the-air update to installed APKs.
# Actions → Release → Run workflow: pick what to release from the dropdown.
# Dependencies install at the repo root (npm workspaces); EAS commands run from apps/mobile.
on:
  push:
    branches: [main]
    paths:
      - apps/mobile/**
      - packages/core/**
      - package.json
      - package-lock.json
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      release:
        description: What to release
        type: choice
        required: true
        default: Release APK application
        options:
          - Release APK application
          - Release command line tool
          - Release Mac widget
          - Over-the-air update (JavaScript only)
      notes:
        description: Release notes (leave empty to list the commits)
        type: string
        required: false

jobs:
  update:
    if: github.event_name == 'push' || inputs.release == 'Over-the-air update (JavaScript only)'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check for EXPO_TOKEN
        id: token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "EXPO_TOKEN is not set, so this push will not update the phone."
            echo "has=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.token.outputs.has == 'true'
        uses: actions/checkout@v5

      - name: Setup Node
        if: steps.token.outputs.has == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup EAS
        if: steps.token.outputs.has == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        if: steps.token.outputs.has == 'true'
        run: npm ci

      - name: Publish update
        if: steps.token.outputs.has == 'true'
        working-directory: apps/mobile
        env:
          MESSAGE: ${{ github.event.head_commit.message || 'Update from GitHub' }}
        run: eas update --channel preview --environment preview --non-interactive --message "$MESSAGE"

  apk:
    if: github.event_name == 'workflow_dispatch' && inputs.release == 'Release APK application'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Check for EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add the EXPO_TOKEN repository secret before releasing an APK."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      # Signed with the keystore EAS keeps for this app, so each APK installs over the last one.
      # versionCode goes up by one on every build (remote version source in eas.json).
      - name: Build APK on EAS
        working-directory: apps/mobile
        run: eas build --platform android --profile preview --non-interactive --wait --json --message "Release from ${GITHUB_SHA::7}" > build.json

      - name: Download APK
        id: apk
        working-directory: apps/mobile
        run: |
          version=$(jq -r '.[0].appVersion' build.json)
          code=$(jq -r '.[0].appBuildVersion' build.json)
          url=$(jq -r '.[0].artifacts.buildUrl' build.json)
          file="logbook-$version-$code.apk"
          curl --fail --silent --show-error --location --output "$file" "$url"
          {
            echo "version=$version"
            echo "code=$code"
            echo "file=$file"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
          VERSION: ${{ steps.apk.outputs.version }}
          CODE: ${{ steps.apk.outputs.code }}
          FILE: ${{ steps.apk.outputs.file }}
        working-directory: apps/mobile
        run: |
          if [ -n "$NOTES" ]; then notes=(--notes "$NOTES"); else notes=(--generate-notes); fi
          gh release create "v$VERSION-$CODE" "$FILE" \
            --title "Logbook $VERSION (build $CODE)" \
            --target "$GITHUB_SHA" \
            --latest \
            "${notes[@]}"

  # The CLI ships as one bundled file on a cli-v<version> release. Installed copies find it through the
  # GitHub releases API (update notice, `logbook update`, install.sh). Not marked latest, so the repo's
  # latest release stays the APK that Obtainium installs.
  cli:
    if: github.event_name == 'workflow_dispatch' && inputs.release == 'Release command line tool'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test -w @logbook/core -w @logbook/cli

      - name: Build
        id: build
        run: |
          npm run build -w @logbook/cli
          echo "version=$(node -p 'require("./apps/cli/package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          if gh release view "cli-v$VERSION" > /dev/null 2>&1; then
            echo "::error::cli-v$VERSION is already released. Raise the version in apps/cli/package.json first."
            exit 1
          fi
          if [ -n "$NOTES" ]; then notes=(--notes "$NOTES"); else notes=(--generate-notes); fi
          gh release create "cli-v$VERSION" apps/cli/dist/logbook.mjs \
            --title "Logbook CLI $VERSION" \
            --target "$GITHUB_SHA" \
            --latest=false \
            "${notes[@]}"

  # A universal (Apple Silicon + Intel) build on a GitHub Mac. The .dmg is for first installs; the signed
  # .app.tar.gz is what installed widgets download. latest.json on the rolling widget-updates release tells
  # them a new version exists. Neither release is marked latest, so the repo's latest stays the APK.
  widget:
    if: github.event_name == 'workflow_dispatch' && inputs.release == 'Release Mac widget'
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Check for the update signing key
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD secrets (see README)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust for both Mac architectures
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Read version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./apps/desktop/src-tauri/tauri.conf.json").version')
          if gh release view "widget-v$version" > /dev/null 2>&1; then
            echo "::error::widget-v$version is already released. Raise version in apps/desktop/src-tauri/tauri.conf.json first."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build -w @logbook/desktop -- --target universal-apple-darwin --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: Collect files
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
          NOTES: ${{ inputs.notes }}
        run: |
          bundle=apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle
          name="logbook-widget-$VERSION-universal"
          mkdir out
          cp "$bundle"/dmg/*.dmg "out/$name.dmg"
          cp "$bundle/macos/Logbook Widget.app.tar.gz" "out/$name.app.tar.gz"
          cp "$bundle/macos/Logbook Widget.app.tar.gz.sig" "out/$name.app.tar.gz.sig"
          node apps/desktop/scripts/latest-json.mjs "$VERSION" "out/$name.app.tar.gz.sig" \
            "https://github.com/$REPO/releases/download/widget-v$VERSION/$name.app.tar.gz" out/latest.json "$NOTES"
          ls -la out

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -n "$NOTES" ]; then notes=(--notes "$NOTES"); else notes=(--generate-notes); fi
          gh release create "widget-v$VERSION" out/*.dmg out/*.app.tar.gz out/*.app.tar.gz.sig \
            --title "Logbook Widget $VERSION" \
            --target "$GITHUB_SHA" \
            --latest=false \
            "${notes[@]}"

      # Published last, so installed widgets only hear about a version once its files are downloadable.
      - name: Point installed widgets at it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view widget-updates > /dev/null 2>&1; then
            gh release create widget-updates --title "Logbook Widget update feed" --prerelease --latest=false \
              --notes "Installed Logbook Widgets read latest.json here to find updates. Download the app from the widget-v releases."
          fi
          gh release upload widget-updates out/latest.json --clobber
