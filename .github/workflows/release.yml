name: Release

# Push to main that touches the mobile app or shared code: publish an over-the-air update to installed APKs.
# Actions → Release → Run workflow: pick what to release from the dropdown.
# Dependencies install at the repo root (npm workspaces); EAS commands run from apps/mobile.
on:
  push:
    branches: [main]
    paths:
      - apps/mobile/**
      - packages/core/**
      - package.json
      - package-lock.json
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      release:
        description: What to release
        type: choice
        required: true
        default: Release APK application
        options:
          - Release APK application
          - Release command line tool
          - Over-the-air update (JavaScript only)
      notes:
        description: Release notes (leave empty to list the commits)
        type: string
        required: false

jobs:
  update:
    if: github.event_name == 'push' || inputs.release == 'Over-the-air update (JavaScript only)'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check for EXPO_TOKEN
        id: token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "EXPO_TOKEN is not set, so this push will not update the phone."
            echo "has=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.token.outputs.has == 'true'
        uses: actions/checkout@v5

      - name: Setup Node
        if: steps.token.outputs.has == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup EAS
        if: steps.token.outputs.has == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        if: steps.token.outputs.has == 'true'
        run: npm ci

      - name: Publish update
        if: steps.token.outputs.has == 'true'
        working-directory: apps/mobile
        env:
          MESSAGE: ${{ github.event.head_commit.message || 'Update from GitHub' }}
        run: eas update --channel preview --environment preview --non-interactive --message "$MESSAGE"

  apk:
    if: github.event_name == 'workflow_dispatch' && inputs.release == 'Release APK application'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Check for EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add the EXPO_TOKEN repository secret before releasing an APK."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      # Signed with the keystore EAS keeps for this app, so each APK installs over the last one.
      # versionCode goes up by one on every build (remote version source in eas.json).
      - name: Build APK on EAS
        working-directory: apps/mobile
        run: eas build --platform android --profile preview --non-interactive --wait --json --message "Release from ${GITHUB_SHA::7}" > build.json

      - name: Download APK
        id: apk
        working-directory: apps/mobile
        run: |
          version=$(jq -r '.[0].appVersion' build.json)
          code=$(jq -r '.[0].appBuildVersion' build.json)
          url=$(jq -r '.[0].artifacts.buildUrl' build.json)
          file="logbook-$version-$code.apk"
          curl --fail --silent --show-error --location --output "$file" "$url"
          {
            echo "version=$version"
            echo "code=$code"
            echo "file=$file"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
          VERSION: ${{ steps.apk.outputs.version }}
          CODE: ${{ steps.apk.outputs.code }}
          FILE: ${{ steps.apk.outputs.file }}
        working-directory: apps/mobile
        run: |
          if [ -n "$NOTES" ]; then notes=(--notes "$NOTES"); else notes=(--generate-notes); fi
          gh release create "v$VERSION-$CODE" "$FILE" \
            --title "Logbook $VERSION (build $CODE)" \
            --target "$GITHUB_SHA" \
            --latest \
            "${notes[@]}"

  # The CLI ships as one bundled file on a cli-v<version> release. Installed copies find it through the
  # GitHub releases API (update notice, `logbook update`, install.sh). Not marked latest, so the repo's
  # latest release stays the APK that Obtainium installs.
  cli:
    if: github.event_name == 'workflow_dispatch' && inputs.release == 'Release command line tool'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test -w @logbook/core -w @logbook/cli

      - name: Build
        id: build
        run: |
          npm run build -w @logbook/cli
          echo "version=$(node -p 'require("./apps/cli/package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          if gh release view "cli-v$VERSION" > /dev/null 2>&1; then
            echo "::error::cli-v$VERSION is already released. Raise the version in apps/cli/package.json first."
            exit 1
          fi
          if [ -n "$NOTES" ]; then notes=(--notes "$NOTES"); else notes=(--generate-notes); fi
          gh release create "cli-v$VERSION" apps/cli/dist/logbook.mjs \
            --title "Logbook CLI $VERSION" \
            --target "$GITHUB_SHA" \
            --latest=false \
            "${notes[@]}"
